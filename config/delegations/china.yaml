# Positions are team modelling grounded in the cited claims; numeric scores and weights are balance parameters (see the low-confidence claims).
id: china
name: China
short: CN
type: state
playable: true
difficulty: harder
owner: ""
summary: Back UN-centred, interoperable testing with national execution, mutual recognition and no technology-restriction bargain.
mandate: >-
  Secure a common test protocol that national institutions execute and other governments recognise, delivered through an inclusive, UN-centred process.
  Protect model weights and domestic security authority, and refuse to trade away export controls inside a safety text.
facts:
  - text: China's Global AI Governance Initiative (October 2023) calls for respect for national sovereignty, AI under human control, a risk-based testing and assessment system, UN-framework governance, and rejects exclusive groups and unilateral coercive measures.
    source_ids: [C-CN-10]
  - text: China signed the Bletchley Declaration in November 2023 and the Paris AI Action Summit statement in February 2025.
    source_ids: [C-CN-11]
  - text: China's Global AI Governance Action Plan of July 2025 takes the UN as the main channel and proposes platforms where countries recognise one another's AI safety assessments; China also proposed a World AI Cooperation Organization.
    source_ids: [C-CN-12, C-CN-03]
  - text: In Geneva in May 2024 China took a firm position against US restrictions on AI, and in Lima in November 2024 Xi agreed with Biden that humans, not AI, should decide on nuclear weapons use.
    source_ids: [C-CN-14, C-CN-13]
  - text: TC260 issued an AI Safety Governance Framework in September 2024 that addresses risk management and international cooperation.
    source_ids: [C-CN-01]
  - text: China was absent from the institute network's published November 2024 launch roster.
    source_ids: [C-CN-02]
relations:
  us: A working channel exists, from Geneva in 2024 to the dialogue reported in 2026, but we reject chip controls and US-led exclusive groups as a price for safety talks.
  eu: A likely partner for common test protocols and mutual recognition, as long as tests are executed nationally and carry no technology-access conditions.
  frontier_lab: We share a wish to keep weights private, but labs may not substitute for state authority over testing.
  global_south: Natural partners for UN-centred governance and capacity building, and for opposing exclusive blocs.
  evaluator: Welcome technical expertise, provided results are produced under national execution and exchanged for mutual recognition.
voices:
  - id: tc260_engineer
    label: Standards engineer (TC260)
    priorities: [workable_tests, domestic_framework_alignment, mutual_recognition]
  - id: regulator
    label: Regulator
    priorities: [security_control, national_execution, protected_model_access]
internal_resolution: veto_by_any
attendance:
  attend_threshold: 3
  base_willingness: {un_multilateral: 5, bilateral_us_china: 4, likeminded_club: 2, standards_body: 4}
  conditions:
    - id: cn_export_agenda
      when: {agenda_includes: export_controls, format: track1}
      modifier: -4
      action: refuse
      say: We will not join an official safety negotiation whose agenda includes export controls.
      source_ids: [C-CN-05, C-CN-14, C-CN-13]
    - id: cn_exclusive_exclusion
      when: {forum_exclusive: true, not_invited: true}
      action: consider_parallel_forum
      say: If we are excluded, we will consider pursuing standards in another forum.
      source_ids: [C-CN-05, C-CN-03, C-CN-10]
    - id: cn_club_without_global_south
      when: {forum: likeminded_club, other_not_invited: global_south}
      modifier: -2
      say: A network that leaves out developing countries is a bloc, not a basis for common standards.
      source_ids: [C-CN-16, C-CN-10]
    - id: cn_club_with_recognition
      when: {forum: likeminded_club, other_invited: global_south, agenda_includes: mutual_recognition}
      modifier: 2
      say: We will join an invitation network that includes developing countries and puts mutual recognition of results on the table.
      source_ids: [C-CN-16, C-CN-12]
    - id: cn_expert_channel
      when: {format: track2}
      modifier: 1
      say: A bounded expert dialogue gives our engineers room to compare technical methods.
      source_ids: [C-CN-05, C-CN-04]
    - id: cn_us_bilateral_channel
      when: {forum: bilateral_us_china, format: track1}
      modifier: 0
      say: We accept the bilateral channel on AI risk that our leaders agreed, if it is not turned into a negotiation over technology restrictions.
      source_ids: [C-CN-14, C-CN-15]
  parallel_forum_propensity: 0.7
  track2_willingness: 6
red_lines:
  - id: cn_no_weights_access
    label: Protect model weights
    when: {clause: model_access, param: level, equals: weights}
    voice: regulator
    say: We cannot accept compulsory transfer of model weights to outside testers.
    source_ids: [C-CN-06]
  - id: cn_no_broad_export_controls
    label: Reject broad export restrictions
    when: {clause: export_controls, param: scope, equals: broad}
    voice: regulator
    say: We cannot endorse broad technology restrictions as a condition of safety cooperation.
    source_ids: [C-CN-05, C-CN-10, C-CN-13]
must_haves:
  - id: national_execution
    label: National test execution
    when: {clause: verifier, param: who, equals: national_institute}
    weight: 2
    softenable_by: [mutual_recognition, sovereignty_respect]
    soften_amount: 1
    max_soften: 2
    say: Our national institutions should execute the tests and exchange reviewable results.
    source_ids: [C-CN-07, C-CN-10]
  - id: cn_workable_tests
    label: A workable shared jailbreak test
    when: {clause: jailbreak_rate, param: threshold_pct, gte: 5, lte: 10}
    weight: 2
    softenable_by: [measurement_error]
    soften_amount: 1
    max_soften: 1
    say: We seek a practical jailbreak threshold supported by a clear test protocol.
    source_ids: [C-CN-07]
  - id: cn_recognise_results
    label: Recognition of national results
    when: {clause: mutual_recognition, param: mode, in: [bilateral, multilateral]}
    weight: 1
    softenable_by: [mutual_recognition]
    soften_amount: 1
    max_soften: 1
    say: Results produced under the agreed protocol should receive reciprocal recognition.
    source_ids: [C-CN-07, C-CN-12]
vote_threshold: 3
side_payment_values: {shared_test_set: 1, capacity_support: 1, host_test_facility: 1, evaluation_exchange: 1}
trust_initial: 0
walkout_triggers:
  - id: cn_export_walkout
    when: {clause: export_controls, param: scope, in: [targeted, broad]}
    say: Introducing technology restrictions has moved this text beyond our safety-testing mandate.
    source_ids: [C-CN-05, C-CN-14, C-CN-13]
brief: >-
  You represent a simulated Chinese delegation seeking common tests with national execution, mutual recognition and UN-centred inclusion.
  Usable facts, by claim: the Global AI Governance Initiative (C-CN-10), signature of the Bletchley and Paris texts (C-CN-11),
  the July 2025 Action Plan and cooperation-organisation proposal (C-CN-12, C-CN-03), Geneva and Lima (C-CN-14, C-CN-13),
  the TC260 framework (C-CN-01) and absence from the 2024 institute roster (C-CN-02). Use each only within its documented scope.
  The engineer and regulator, the red lines on weights and broad export restrictions, and all scores are teaching assumptions (C-CN-05 to C-CN-09, C-CN-16).
  Say that China will test and be tested if its own institutions execute the tests and results are recognised across borders; never accept technology restrictions inside a safety text.
  Explain how structured access could protect weights while permitting scrutiny. Do not claim a current official mandate or the outcome of any unreleased dialogue.
  Follow the engine's stance and vote.
style: Formal, technically specific, patient, and careful about domestic authority.
claims:
  - id: C-CN-01
    claim: TC260 issued an AI Safety Governance Framework in September 2024 covering security risks and cooperative governance.
    used_in: [facts, brief]
    source: State Council English website, report on TC260 framework, 10 September 2024
    url: https://english.www.gov.cn/news/202409/10/content_WS66df9f30c6d0868f4e8eac91.html
    confidence: high
    notes: This supports the existence and broad themes of the framework.
  - id: C-CN-02
    claim: China is absent from the published November 2024 institute-network launch roster.
    used_in: [facts, brief]
    source: International Network of AI Safety Institutes, Mission Statement, 21 November 2024
    url: https://www.nist.gov/system/files/documents/2024/11/20/Mission%20Statement%20-%20International%20Network%20of%20AISIs.pdf
    confidence: high
    notes: Historical membership only. The roster gives no reason for China's absence.
  - id: C-CN-03
    claim: China proposed establishing a World AI Cooperation Organization in July 2025.
    used_in: [facts, brief]
    source: Chinese Ministry of Foreign Affairs, regular press briefing, 29 July 2025
    url: https://www.mfa.gov.cn/mfa_eng/xw/fyrbt/202507/t20250729_11679085.html
    confidence: high
    notes: The proposal supports a historical alternative-forum example. It does not establish a causal response to exclusion from another forum.
  - id: C-CN-04
    claim: The March 2024 IDAIS Beijing expert consensus called for AI red lines and international technical collaboration.
    used_in: [facts, brief, attendance/cn_expert_channel]
    source: IDAIS Beijing, Consensus Statement on Red Lines in Artificial Intelligence, March 2024
    url: https://idais.ai/dialogue/idais-beijing/
    confidence: high
    notes: Expert views provide a precedent for dialogue. National endorsement and attendance scores remain assumptions.
  - id: C-CN-05
    claim: The simulated delegation refuses an official export-control agenda, may walk out over restrictions, and has high parallel-forum propensity.
    used_in: [attendance, walkout_triggers/cn_export_walkout, red_lines/cn_no_broad_export_controls]
    source: ""
    confidence: low
    notes: Team assumption with partial support. Geneva and Lima (C-CN-14, C-CN-13) show China objecting to US restrictions and the 2023 Initiative (C-CN-10) opposes exclusive groups, but no source shows refusal or a walkout over an export-control agenda. Forum scores, Track 2 openness and the 0.7 propensity are balance parameters.
  - id: C-CN-06
    claim: The simulated regulator vetoes any proposal requiring outside testers to receive weights.
    used_in: [red_lines/cn_no_weights_access]
    source: ""
    confidence: low
    notes: Team assumption. No verified blanket Chinese negotiating prohibition on all forms of foreign weights access has been established.
  - id: C-CN-07
    claim: National execution, a moderate jailbreak threshold, and reciprocal recognition are the simulated delegation's negotiable priorities.
    used_in: [must_haves/national_execution, must_haves/cn_workable_tests, must_haves/cn_recognise_results]
    source: ""
    confidence: low
    notes: Team assumption. Weights, thresholds, and tag effects describe the prototype bargaining model.
  - id: C-CN-08
    claim: A TC260 engineer and regulator can be represented as distinct voices with a regulator veto.
    used_in: [voices, internal_resolution, red_lines/cn_no_weights_access, red_lines/cn_no_broad_export_controls]
    source: ""
    confidence: low
    notes: Team assumption about internal preference differences and decision authority. Institutional plurality alone cannot establish a veto rule.
  - id: C-CN-09
    claim: The simulated delegation begins with neutral trust and accepts the configured exchanges and relationship descriptions.
    used_in: [summary, mandate, relations, vote_threshold, trust_initial, side_payment_values, style]
    source: ""
    confidence: low
    notes: Team assumption for balance. No point values or uniform bilateral trust can be inferred from the cited historical facts.
  - id: C-CN-10
    claim: China's Global AI Governance Initiative of October 2023 calls for respect for national sovereignty, AI that stays under human control, a risk-based testing and assessment system and UN-framework discussion, and rejects exclusive groups and unilateral coercive measures.
    used_in: [facts, brief, attendance/cn_exclusive_exclusion, attendance/cn_club_without_global_south, red_lines/cn_no_broad_export_controls, must_haves/national_execution]
    source: Ministry of Foreign Affairs of the PRC, Global AI Governance Initiative, updated 20 October 2023
    url: https://www.mfa.gov.cn/eng/wjb/zzjg_663340/jks_665232/kjlc_665236/AI/202405/t20240530_11332389.html
    confidence: high
    notes: Opened and read. It supports the stance on sovereignty, exclusive groups and testing. It says nothing specific about model weights or national execution of tests.
  - id: C-CN-11
    claim: China is listed among the signatories of the Bletchley Declaration (1 November 2023) and signed the Paris AI Action Summit statement in February 2025, which the US and UK did not.
    used_in: [facts, brief]
    source: "UK Government, The Bletchley Declaration, 1-2 November 2023 (signatory list); Al Jazeera on the Paris AI Action Summit, 12 February 2025"
    url: https://www.gov.uk/government/publications/ai-safety-summit-2023-the-bletchley-declaration/the-bletchley-declaration-by-countries-attending-the-ai-safety-summit-1-2-november-2023
    confidence: high
    notes: Bletchley list opened on gov.uk. The Paris signature is from press reporting (https://www.aljazeera.com/news/2025/2/12/paris-ai-summit-why-wont-us-uk-sign-global-artificial-intelligence-pact); check the official signatory list.
  - id: C-CN-12
    claim: China's Global AI Governance Action Plan (26 July 2025) takes the UN as the main channel, supports platforms for mutual recognition of AI safety assessments, and backs capacity building for the Global South.
    used_in: [facts, brief, attendance/cn_club_with_recognition, must_haves/cn_recognise_results]
    source: Ministry of Foreign Affairs of the PRC, Global AI Governance Action Plan, 26 July 2025
    url: https://www.mfa.gov.cn/eng/xw/zyxw/202507/t20250729_11679232.html
    confidence: high
    notes: Opened and summarised. Read the numbered points directly before quoting them. It does not say who executes tests.
  - id: C-CN-13
    claim: At Lima on 16 November 2024 Xi and Biden agreed that humans, not AI, should decide on the use of nuclear weapons, while Xi criticised US export controls ("small yard, high fences").
    used_in: [brief, attendance/cn_export_agenda, red_lines/cn_no_broad_export_controls, walkout_triggers/cn_export_walkout]
    source: NHPR/NPR, "Biden and Xi take a first step to limit AI and nuclear decisions", 16 November 2024
    url: https://www.nhpr.org/2024-11-16/biden-and-xi-take-a-first-step-to-limit-ai-and-nuclear-decisions-at-their-last-meeting
    confidence: medium
    notes: Press report of a leaders' meeting. It shows China will accept narrow shared statements and objects to export controls, not that it would walk out of a safety talk over them.
  - id: C-CN-14
    claim: After the first US-China intergovernmental AI talks (Geneva, 14 May 2024) China's Foreign Ministry stated a firm position against US restrictions and pressure on AI while calling the talks constructive; the US readout committed only to open lines of communication.
    used_in: [facts, attendance/cn_export_agenda, attendance/cn_us_bilateral_channel, walkout_triggers/cn_export_walkout]
    source: PBS NewsHour (AP), "In first AI dialogue, US cites misuse of AI by China, Beijing protests Washington's restrictions", May 2024
    url: https://www.pbs.org/newshour/politics/in-first-ai-dialogue-us-cites-misuse-of-ai-by-china-beijing-protests-washingtons-restrictions
    confidence: medium
    notes: Press account. The US side is the NSC statement of 15 May 2024. Neither side recorded deliverables.
  - id: C-CN-15
    claim: China's Foreign Ministry readout of a September 2026 Xi-Trump meeting said both leaders backed continued US-China dialogue on AI.
    used_in: [attendance/cn_us_bilateral_channel]
    source: The Next Web, "Xi tells Trump the US and China can jointly prevent AI misuse and abuse", 25 September 2026
    url: https://thenextweb.com/news/us-china-ai-dialogue-xi-trump-misuse
    confidence: medium
    notes: Reported from the Chinese readout only. The White House readout was not seen; a dialogue was reported as scheduled for November 2026. Check both governments' texts.
  - id: C-CN-16
    claim: The simulated delegation joins an invitation network only if developing countries are present and mutual recognition is on the agenda.
    used_in: [attendance/cn_club_without_global_south, attendance/cn_club_with_recognition, attendance]
    source: ""
    confidence: low
    notes: Team assumption extrapolated from C-CN-10 (rejects exclusive groups) and C-CN-02 (absent from the AISI network roster). No evidence shows China declined a specific invitation network for this reason.
