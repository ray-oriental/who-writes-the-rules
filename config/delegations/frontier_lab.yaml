    notes: Announcements confirm access before and after release but not its technical terms. The contracts are not public; a human reviewer should look for the institutes' later technical reports.
    claim_ids: [C-LAB-04, C-LAB-05]
  - id: R-LAB-05
    question: Can a compute trigger define an efficient testing scope without missing dangerous capabilities in smaller models?
    why: lab_predictable_scope and its measurement_error softening need evidence about compliance burden and coverage.
    status: todo
    owner: ""
    leads: ["capability-threshold frameworks", "EU AI Act Article 51", "evaluations of small specialised models", "compute-accounting studies"]
    claim_ids: [C-LAB-09]
  - id: R-LAB-06
    question: Do developers publicly prefer one shared evaluation protocol over several national ones, and which developers say so?
    why: lab_shared_protocol depends on this; no developer statement was found.
    status: todo
    owner: ""
    leads: ["developer responses to national AI-testing consultations", "Frontier Model Forum publications", "standards committee submissions"]
    claim_ids: [C-LAB-09]
  - id: R-LAB-07
    question: What forum-selection behaviour and willingness to participate in expert dialogue do actual laboratories document?
    why: attendance/lab_verification_agenda, lab_expert_channel, and parallel_forum_propensity depend on C-LAB-07.
    status: todo
    owner: ""
    leads: ["AI-summit participation records", "institute testing partnerships", "technical standards committee membership"]
    claim_ids: [C-LAB-06, C-LAB-07]
  - id: R-LAB-08
    question: Which disagreements between labs should a composite role retain, and what exchanges (a secured test facility, shared test sets) have demonstrable value?
    why: relations, side_payment_values, trust_initial, and vote_threshold depend on C-LAB-09 and C-LAB-10.
    status: todo
