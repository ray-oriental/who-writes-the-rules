# Positions are team modelling grounded in the cited claims; unsourced numbers are balance parameters.
id: eu
name: European Union
short: EU
type: regional
playable: true
difficulty: medium
owner: ""
summary: Seek independently checkable evaluations and accountable incident reporting for systemic-risk models.
mandate: >-
  Carry the AI Act's logic into the summit text: systemic-risk models are evaluated by someone other than their developer,
  testers get enough controlled access to examine the claims, and serious incidents reach a public authority within days.
  Accept nationally executed tests only if the results can be reviewed and recognised across borders.
facts:
  - text: The AI Act entered into force on 1 August 2024.
    source_ids: [C-EU-08]
  - text: General-purpose AI model obligations began applying in August 2025, with a later compliance date for models already on the market before 2 August 2025.
    source_ids: [C-EU-02]
  - text: The Act presumes high-impact capabilities above 10^25 training FLOP and also allows systemic-risk designation on other grounds.
    source_ids: [C-EU-01]
  - text: Providers of systemic-risk models must assess and mitigate systemic risks through model evaluations, track and report serious incidents, and ensure cybersecurity; the AI Office can itself conduct evaluations of general-purpose models.
    source_ids: [C-EU-09]
  - text: The General-Purpose AI Code of Practice, published on 10 July 2025, asks signatories to give independent external evaluators adequate access to their most capable models and sets initial incident-report windows of 2, 5, 10 and 15 days by severity.
    source_ids: [C-EU-10, C-EU-11]
  - text: The European Commission appears in the international network of AI safety institutes' November 2024 launch roster, and the EU was among the signatories of the Bletchley Declaration.
    source_ids: [C-EU-03, C-EU-12]
relations:
  china: Seek comparability of nationally run tests through a protocol others can review, not a promise to trust them.
  us: Seek interoperable evaluations while the two sides differ on how binding obligations should be.
  frontier_lab: Expect credible external evidence and prompt incident reports, while allowing safeguards around the weights.
  global_south: Seek a standard that smaller participants can implement, which means paying for the shared facility rather than only imposing duties.
  evaluator: Share an interest in independent scrutiny, documented methods and reproducible protocols.
voices: []
internal_resolution: lead_voice
attendance:
  attend_threshold: 3
  base_willingness: {un_multilateral: 5, bilateral_us_china: 1, likeminded_club: 5, standards_body: 5}
  conditions:
    - id: eu_verification_agenda
      when: {agenda_includes: verification_tech}
      modifier: 1
      say: A verification agenda gives us a route to the independent evaluation and access arrangements we need.
      source_ids: [C-EU-04, C-EU-10]
    - id: eu_expert_channel
      when: {format: track2}
      modifier: 1
      say: Expert work can clarify methods before an official commitment.
      source_ids: [C-EU-04]
  parallel_forum_propensity: 0.4
  track2_willingness: 6
red_lines:
  - id: eu_no_self_report_only
    label: Reject developer self-reporting
    when: {clause: verifier, param: who, equals: self_report}
    say: A developer marking its own homework cannot be the verification arrangement; the Code of Practice already expects independent external evaluators.
    source_ids: [C-EU-05, C-EU-11]
  - id: eu_no_public_summary_only
    label: Incident reports must reach an authority
    when: {clause: incident_reporting, param: recipient, equals: public_summary}
    say: A public summary is not a report. Serious incidents must reach a competent authority, as they reach the AI Office under our rules.
    source_ids: [C-EU-13]
must_haves:
  - id: eu_independent_verification
    label: Independent verification
    when: {clause: verifier, param: who, equals: third_party}
    weight: 2
    softenable_by: [mutual_recognition, verify_without_weights]
    soften_amount: 1
    max_soften: 2
    say: We seek independent verification, and will consider nationally executed tests with credible reciprocal scrutiny.
    source_ids: [C-EU-06, C-EU-11]
  - id: eu_structured_access
    label: Meaningful tester access
    when: {clause: model_access, param: level, in: [structured_access, weights]}
    weight: 2
    softenable_by: [verify_without_weights]
    soften_amount: 1
    max_soften: 1
    say: Testers need enough controlled access to examine the claims they are asked to endorse.
    source_ids: [C-EU-06, C-EU-11]
  - id: eu_incident_reporting
    label: Incident reports within days
    when: {clause: incident_reporting, param: deadline_days, lte: 15}
    weight: 2
    softenable_by: [measurement_error]
    soften_amount: 1
    max_soften: 1
    say: Serious incidents should reach the authority within days, not months; our own Code of Practice uses windows between two and fifteen days.
    source_ids: [C-EU-06, C-EU-10]
vote_threshold: 3
side_payment_values: {shared_test_set: 1, capacity_support: 1, host_test_facility: 1, evaluation_exchange: 1}
trust_initial: 0
walkout_triggers: []
brief: >-
  Represent a simulated EU delegation concerned with systemic risks and accountable evidence.
  Use the AI Act's entry into force and compute presumption (C-EU-08, C-EU-01), the application date for general-purpose model duties (C-EU-02),
  the systemic-risk duties and the AI Office's evaluation powers (C-EU-09), the Code of Practice's external-evaluator and incident-window provisions (C-EU-10, C-EU-11),
  and the network roster and Bletchley signature (C-EU-03, C-EU-12).
  The exact verification veto, the fifteen-day game threshold and the bargaining values are prototype assumptions (C-EU-04 to C-EU-07).
  Explore whether a common protocol, reciprocal review and structured access can make national execution credible.
  Follow the engine's stance and vote. Never describe the game's fifteen-day preference or third-party demand as an exact legal obligation; the real Code windows are 2, 5, 10 and 15 days by severity.
style: Precise, procedural, and focused on accountability and workable scrutiny.
claims:
  - id: C-EU-01
    claim: The AI Act presumes high-impact capabilities above 10^25 training FLOP and also permits systemic-risk designation on other grounds.
    used_in: [facts, brief]
    source: European Commission, General-Purpose AI Models in the AI Act, questions and answers
    url: https://digital-strategy.ec.europa.eu/en/faqs/general-purpose-ai-models-ai-act-questions-answers
    confidence: high
    notes: The game's compute clause simplifies the legal framework.
  - id: C-EU-02
    claim: General-purpose AI model obligations began applying in August 2025, with a later compliance date for models already on the market before 2 August 2025.
    used_in: [facts, brief]
    source: European Commission, announcement on application of general-purpose AI rules, 1 August 2025
    url: https://digital-strategy.ec.europa.eu/en/news/eu-rules-general-purpose-ai-models-start-apply-bringing-more-transparency-safety-and-accountability
    confidence: high
    notes: Historical implementation announcement. Consult the current legal text for precise duties and deadlines.
  - id: C-EU-03
    claim: The European Commission was listed in the institute network's November 2024 launch roster.
    used_in: [facts, brief]
    source: International Network of AI Safety Institutes, Mission Statement, 21 November 2024
    url: https://www.nist.gov/system/files/documents/2024/11/20/Mission%20Statement%20-%20International%20Network%20of%20AISIs.pdf
    confidence: high
  - id: C-EU-04
    claim: The simulated EU delegation is willing to join inclusive standards discussions and gives extra weight to verification and expert dialogue.
    used_in: [attendance]
    source: ""
    confidence: low
    notes: Team assumption about forum selection and numeric attendance. No current mandate is implied.
  - id: C-EU-05
    claim: The simulated EU delegation vetoes a verifier clause limited to developer self-reporting.
    used_in: [red_lines/eu_no_self_report_only]
    source: ""
    confidence: low
    notes: Team assumption. The AI Act does not itself ban provider-run evaluations; the Code of Practice expects independent external evaluators for the most capable models unless a model is judged similarly safe (C-EU-11). The veto is a negotiating simplification.
  - id: C-EU-06
    claim: Independent verification, meaningful tester access, and incident reports within fifteen days are negotiable EU priorities in the prototype.
    used_in: [must_haves/eu_independent_verification, must_haves/eu_structured_access, must_haves/eu_incident_reporting]
    source: ""
    confidence: low
    notes: Team assumption about their weights and softening increments, which are balance choices. The fifteen-day value is anchored on the longest Code of Practice window (C-EU-10); the independence and access themes on C-EU-11.
  - id: C-EU-07
    claim: Neutral trust and the configured relationships, exchanges, and vote threshold approximate a useful EU bargaining baseline.
    used_in: [summary, mandate, relations, vote_threshold, side_payment_values, trust_initial, style]
    source: ""
    confidence: low
    notes: Team assumption for playtesting. The EU is represented as a single regional delegation.
  - id: C-EU-08
    claim: The AI Act entered into force on 1 August 2024.
    used_in: [facts, brief]
    source: European Commission, "AI Act enters into force", 1 August 2024
    url: https://commission.europa.eu/news/ai-act-enters-force-2024-08-01_en
    confidence: high
  - id: C-EU-09
    claim: Providers of general-purpose models with systemic risk must assess and mitigate systemic risks (in particular through model evaluations), track, document and report serious incidents, and ensure adequate cybersecurity (Article 55); the AI Office can conduct evaluations of general-purpose models (Article 92).
    used_in: [facts, brief]
    source: European Commission, General-Purpose AI Models in the AI Act, questions and answers
    url: https://digital-strategy.ec.europa.eu/en/faqs/general-purpose-ai-models-ai-act-questions-answers
    confidence: high
    notes: Read from the Commission questions and answers. Check the Regulation (EU) 2024/1689 text before marking verified. That page does not use the words adversarial testing; the phrase belongs to Article 55 of the Regulation and was not checked here.
  - id: C-EU-10
    claim: The Code of Practice safety and security chapter sets initial serious-incident report windows of 2 days (critical-infrastructure disruption), 5 days (serious cybersecurity breach), 10 days (death) and 15 days (other serious harm), save in exceptional circumstances.
    used_in: [facts, brief, must_haves/eu_incident_reporting]
    source: General-Purpose AI Code of Practice, Safety and Security chapter, Commitment 9, Measure 9.3 (as mirrored by the AI Act Explorer)
    url: https://artificialintelligenceact.eu/ai-act-explorer/cop-safety
    confidence: medium
    notes: Read from an unofficial mirror of the Code. Compare with the Commission-hosted text before marking verified.
  - id: C-EU-11
    claim: The Code of Practice, published on 10 July 2025, asks signatories to provide an adequate number of independent external evaluators with adequate free access to the most capable model version, unless the model is considered similarly safe or safer with regard to the same systemic risk.
    used_in: [facts, brief, red_lines/eu_no_self_report_only, must_haves/eu_independent_verification, must_haves/eu_structured_access]
    source: General-Purpose AI Code of Practice, Safety and Security chapter, Commitment 3, Measure 3.5 (as mirrored by the AI Act Explorer); publication date from the European Commission questions and answers
    url: https://artificialintelligenceact.eu/ai-act-explorer/cop-safety
    confidence: medium
    notes: Same mirror caveat as C-EU-10. The game treats this as support for an independent-verification priority, not as an EU demand for third-party testing in an international agreement.
  - id: C-EU-12
    claim: The European Union was among the signatories of the Bletchley Declaration of 1-2 November 2023.
    used_in: [facts, brief]
    source: Bletchley Declaration by countries attending the AI Safety Summit, 1-2 November 2023 (UK Government); count of 28 countries and the EU as reported by the Australian government and others
    url: https://www.gov.uk/government/publications/ai-safety-summit-2023-the-bletchley-declaration/the-bletchley-declaration-by-countries-attending-the-ai-safety-summit-1-2-november-2023
    confidence: medium
    notes: The EU's signature was taken from secondary reports of the signatory list; read the declaration page itself before marking verified. Seoul and Paris were not checked.
  - id: C-EU-13
    claim: Serious incidents involving systemic-risk models are reported to the AI Office (and national authorities where applicable), not published as a summary only.
    used_in: [red_lines/eu_no_public_summary_only]
    source: AI Act Article 55 as described in the Commission questions and answers; recipient detail from commentary on the Code of Practice
    url: https://digital-strategy.ec.europa.eu/en/faqs/general-purpose-ai-models-ai-act-questions-answers
    confidence: medium
    notes: The recipient detail was read from secondary commentary. The red line, vetoing a public-summary-only recipient, is a negotiating simplification.
research:
  - id: R-EU-01
    question: Does the AI Act use a greater-than-10^25-FLOP presumption alongside other systemic-risk designation routes?
    why: facts and C-EU-01 need the distinction between a compute trigger and the full legal definition.
    status: found
    owner: ""
    leads: [European Commission general-purpose-model questions and answers, AI Act Article 51]
    notes: Commission explanation opened. Independently check the legal text and scenario date before marking verified.
    claim_ids: [C-EU-01]
  - id: R-EU-02
    question: When did general-purpose model duties begin applying, and what transition was announced for existing models?
    why: facts and brief depend on C-EU-02.
    status: found
    owner: ""
    leads: [European Commission announcement 1 August 2025, AI Act application timeline]
    claim_ids: [C-EU-02]
  - id: R-EU-03
    question: Was the European Commission a participant in the institute network's 2024 launch?
    why: facts depend on C-EU-03.
    status: found
    owner: ""
    leads: [NIST Mission Statement 21 November 2024]
    claim_ids: [C-EU-03]
  - id: R-EU-04
    question: Which obligations require external scrutiny, and which permit providers to conduct and document their own evaluations?
    why: eu_no_self_report_only and eu_independent_verification depend on distinguishing negotiating preferences from legal requirements.
    status: found
    owner: ""
    leads: [AI Act Articles 53 and 55, GPAI Code of Practice safety and security chapter, AI Office evaluation powers]
    notes: Article 55 requires evaluations by the provider; independent external evaluators appear in the Code of Practice with an exception for similarly safe models. Still to check against the Regulation text and the official Code text.
    claim_ids: [C-EU-05, C-EU-09, C-EU-11]
  - id: R-EU-05
    question: What access and incident-reporting arrangements could the EU accept in a cross-border safety-testing agreement?
    why: eu_structured_access and eu_incident_reporting need support for access levels, confidentiality, recipients, and deadlines.
    status: in_progress
    owner: ""
    leads: [AI Act Article 55, European AI Office implementation guidance, institute access agreements]
    notes: Incident windows and the AI Office as recipient found (C-EU-10, C-EU-13). The access levels and confidentiality terms the EU would accept across borders are not yet sourced.
    claim_ids: [C-EU-06, C-EU-10, C-EU-13]
  - id: R-EU-06
    question: What official statements support reciprocal recognition of national tests as a compromise on independent verification?
    why: eu_independent_verification softening by mutual_recognition and verify_without_weights depends on C-EU-06.
    status: todo
    owner: ""
    leads: [EU international AI cooperation statements, national institute network joint assessments, conformity-assessment recognition agreements]
    claim_ids: [C-EU-06]
  - id: R-EU-07
    question: How should EU forum preferences, relations, neutral trust, and exchange values change when treating it as a regional actor?
    why: attendance, vote_threshold, relations, trust_initial, and side_payment_values depend on C-EU-04 and C-EU-07.
    status: todo
    owner: ""
    leads: [Council negotiating mandates, Commission summit statements, structured playtests comparing state and regional seats]
    claim_ids: [C-EU-04, C-EU-07]
  - id: R-EU-08
    question: Did the EU sign the Seoul (2024) and Paris (2025) summit outputs, and with what reservations?
    why: facts cite the Bletchley signature only; the other two summits were not checked.
    status: todo
    owner: ""
    leads: [Seoul Declaration May 2024, Paris AI Action Summit statement 11 February 2025 signatory list]
    claim_ids: [C-EU-12]
  - id: R-EU-09
    question: Does the official Code of Practice text, as hosted by the Commission, match the mirrored wording of Commitments 3 and 9?
    why: C-EU-10 and C-EU-11 were read from an unofficial mirror.
