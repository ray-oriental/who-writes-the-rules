    question: Which protocol makes jailbreak percentages, dangerous-capability tests, compute triggers, and uncertainty estimates comparable across participants?
    why: agenda_catalog/jailbreak_rate, dangerous_capability_eval, compute_threshold, and measurement_uncertainty depend on reproducible operational definitions.
    status: todo
    owner: ""
