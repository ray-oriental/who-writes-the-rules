  - id: R-GEN-05
    question: Which actual incident deadlines, capacity-funding commitments, and export-control disputes could replace the prototype defaults?
    why: agenda_catalog/incident_reporting, capacity_building, export_controls and side-payment values depend on these institutional details.
    status: todo
    owner: ""
    leads: [EU AI Act Article 55, AI Action Summit declaration February 2025, UN capacity-development proposals, official bilateral AI-dialogue readouts]
    claim_ids: [C-GEN-12, C-GEN-13, C-GEN-14]
  - id: R-GEN-06
    question: What real case of under-compliance can be used as historical baggage with a clear commitment, date, failure, and response?
    why: C-GEN-01 and the delegation briefs need a documented case for DESIGN section 12 and course Team work 2.
    status: todo
    owner: ""
    leads: [Anthropic October 2024 Responsible Scaling Policy update, "https://www.anthropic.com/news/announcing-our-updated-responsible-scaling-policy", company review of evaluations completed three days late, independent corroboration and policy version history]
    notes: The company self-reported a procedural lapse and assessed minimal risk. Confirm the original obligation and corroboration before generalising it.
