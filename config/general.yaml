  - id: R-GEN-04
    question: What evidence supports independent verification through structured access and reciprocal acceptance of national results?
    why: agenda_catalog/model_access, verifier, mutual_recognition and the associated softening tags require evidence about technical and legal feasibility.
    status: todo
    owner: ""
    leads: [National safety institute model-access agreements, structured access research, accredited laboratory mutual-recognition agreements, network joint assessments]
